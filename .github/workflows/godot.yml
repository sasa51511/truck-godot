name: Godot APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GV: "4.2.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK check
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/build-tools $ANDROID_HOME/platforms
      - name: Godot + templates
        run: |
          B=https://github.com/godotengine/godot/releases/download/${GV}-stable
          curl -sL -o g.zip $B/Godot_v${GV}-stable_linux.x86_64.zip
          curl -sL -o t.tpz $B/Godot_v${GV}-stable_export_templates.tpz
          unzip -q g.zip && mv Godot_v${GV}-stable_linux.x86_64 godot && chmod +x godot
          mkdir -p ~/.local/share/godot/export_templates/${GV}.stable
          unzip -q t.tpz -d tpl && mv tpl/templates/* ~/.local/share/godot/export_templates/${GV}.stable/
      - name: Keystore + editor settings
        run: |
          base64 -d keystore.b64 > $HOME/debug.keystore
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.tres
          cat ~/.config/godot/editor_settings-4.tres
      - name: Assets (truck model + textures)
        run: |
          cat > conv.mjs <<'EOFJS'
          import {NodeIO} from '@gltf-transform/core';
          import {ALL_EXTENSIONS} from '@gltf-transform/extensions';
          import {dequantize} from '@gltf-transform/functions';
          import {MeshoptDecoder} from 'meshoptimizer';
          import {PNG} from 'pngjs';
          import fs from 'fs';
          import {createRequire} from 'module';
          const require=createRequire(import.meta.url);
          const BASIS=require('./basis_transcoder.js');
          await MeshoptDecoder.ready;
          const B=await BASIS({wasmBinary:fs.readFileSync('basis_transcoder.wasm')});
          B.initializeBasis&&B.initializeBasis();
          const io=new NodeIO().registerExtensions(ALL_EXTENSIONS).registerDependencies({'meshopt.decoder':MeshoptDecoder});
          const d=await io.read(process.argv[2]);
          for(const t of d.getRoot().listTextures()){
            const f=new B.KTX2File(new Uint8Array(t.getImage()));
            if(!f.isValid())throw new Error('bad ktx2 '+t.getName());
            const w=f.getWidth(),h=f.getHeight();
            f.startTranscoding();
            const sz=f.getImageTranscodedSizeInBytes(0,0,0,13); // 13 = RGBA32
            const dst=new Uint8Array(sz);
            if(!f.transcodeImage(dst,0,0,0,13,0,-1,-1))throw new Error('transcode fail');
            f.close();f.delete();
            const png=new PNG({width:w,height:h});png.data=Buffer.from(dst);
            t.setImage(PNG.sync.write(png));t.setMimeType('image/png');t.setURI(t.getName()+'.png');
            console.log('tex',t.getName(),w,h);
          }
          await d.transform(dequantize());
          for(const e of d.getRoot().listExtensionsUsed()){if(['KHR_texture_basisu','EXT_meshopt_compression','KHR_mesh_quantization'].includes(e.extensionName))e.dispose()}
          await io.write(process.argv[3],d);
          console.log('ok',fs.statSync(process.argv[3]).size);
          EOFJS
          set -e
          mkdir -p assets
          P=https://dl.polyhaven.org/file/ph-assets
          curl -sL -o assets/asphalt_d.jpg $P/Textures/jpg/1k/asphalt_02/asphalt_02_diff_1k.jpg
          curl -sL -o assets/asphalt_n.jpg $P/Textures/jpg/1k/asphalt_02/asphalt_02_nor_gl_1k.jpg
          curl -sL -o assets/grass_d.jpg $P/Textures/jpg/1k/aerial_grass_rock/aerial_grass_rock_diff_1k.jpg
          curl -sL -o assets/grass_n.jpg $P/Textures/jpg/1k/aerial_grass_rock/aerial_grass_rock_nor_gl_1k.jpg
          curl -sL -o assets/sky.hdr $P/HDRIs/hdr/1k/kloofendal_48d_partly_cloudy_puresky_1k.hdr
          curl -sL -o l1.glb https://tevy.dev/models/semi-truck/v1/lod1.glb
          npm i --silent @gltf-transform/core @gltf-transform/extensions @gltf-transform/functions meshoptimizer pngjs
          curl -sL -o basis_transcoder.js https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/basis_transcoder.js
          curl -sL -o basis_transcoder.wasm https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/basis_transcoder.wasm
          node conv.mjs l1.glb assets/truck.glb
          ls -l assets
      - name: Import + export
        run: |
          mkdir -p build
          ./godot --headless --import || true
          ./godot --headless --export-debug Android build/truck.apk
          ls -l build
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-latest
          name: Godot spike APK
          files: build/truck.apk
          prerelease: true

  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fetch APK
        run: |
          curl -sL -o truck.apk https://github.com/${{ github.repository }}/releases/download/godot-latest/truck.apk
          ls -l truck.apk
      - name: Emulator run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash verify.sh
      - name: Push screenshots
        if: always()
        run: |
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan shots
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/shot*.png /tmp/log.txt . 2>/dev/null || true
          git add -f *.png log.txt 2>/dev/null || true
          git commit -m "shots" || true
          git push -f origin shots || true
